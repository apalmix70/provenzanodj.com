const hex = s => Uint8Array.from(s.match(/../g).map(b => parseInt(b, 16)));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function apri(chiave) {
  const piano = await crypto.subtle.decrypt({ name: "AES-GCM", iv: hex(NONCE) }, chiave, b64(CT));
  const html = new TextDecoder().decode(piano);
  document.open(); document.write(html); document.close();
}

async function daPassword(pw) {
  const mat = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: hex(SALT), iterations: ITER, hash: "SHA-256" }, mat, 256);
  return new Uint8Array(bits);
}

const importa = raw => crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);

(async () => {
  const salvata = localStorage.getItem("stats_k");
  if (salvata) {
    try { await apri(await importa(hex(salvata))); return; }
    catch (e) { localStorage.removeItem("stats_k"); }
  }
})();

document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; err.textContent = "";
  try {
    const raw = await daPassword(document.getElementById("pw").value);
    const chiave = await importa(raw);
    if (document.getElementById("ric").checked)
      localStorage.setItem("stats_k", [...raw].map(b => b.toString(16).padStart(2, "0")).join(""));
    await apri(chiave);
  } catch (e) {
    err.textContent = "Password sbagliata.";
    go.disabled = false;
  }
});
</script>
