<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compilation — i numeri</title>
<meta name="description" content="I numeri delle compilation mixate da Provenzano Dj: quante sono, quante tracce, gli artisti più presenti, i brani ripresi più volte, anno per anno dal 1994.">
<meta property="og:title" content="Compilation — i numeri">
<meta property="og:description" content="Quante compilation, quante tracce, quali artisti tornano più spesso.">
<meta property="og:type" content="website">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ccircle cx='32' cy='38' r='14' fill='%23FF3131'/%3E%3C/svg%3E">
<style>
@font-face{font-family:'Anton';src:url('../../fonts/Anton-Regular.ttf') format('truetype');font-display:swap}
@font-face{font-family:'Poppins EB';src:url('../../fonts/Poppins-ExtraBold.ttf') format('truetype');font-display:swap}

:root{
  --nero:#000;--rosso:#FF3131;--bianco:#fff;
  --grigio:rgba(255,255,255,.55);--debole:rgba(255,255,255,.35);
  --riga:rgba(255,255,255,.10);--pannello:#0b0b0b;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--nero);color:var(--bianco);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  min-height:100svh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
.contenitore{width:100%;max-width:1080px;margin:0 auto;padding:0 20px}

header{border-bottom:1px solid var(--riga);position:sticky;top:0;z-index:20;background:var(--nero)}
.testata{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0}
.logo{font-family:'Poppins EB',Arial,sans-serif;font-size:19px;letter-spacing:-.04em;line-height:1}
.logo .punto{color:var(--rosso)}
.menu{display:flex;gap:18px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--grigio)}
.menu a.qui{color:var(--bianco)}
.menu a:hover{color:var(--bianco)}

.cartello{padding:34px 0 20px}
.cartello h1{font-family:'Anton',Arial,sans-serif;font-weight:400;text-transform:uppercase;
  font-size:clamp(30px,6vw,54px);letter-spacing:.03em;line-height:1}
.cartello h1 .punto{color:var(--rosso)}
.cartello .sotto{margin-top:12px;color:var(--grigio);font-size:14px;line-height:1.6;max-width:62ch}
.cartello .sotto b{color:var(--bianco);font-weight:600}

/* i totali, in cifre grosse */
/* ⚠ Le righe di separazione le disegnano le CASELLE, non lo sfondo del contenitore.
   Prima il contenitore era grigio e le caselle nere, e il grigio si vedeva nel `gap`:
   funzionava finche' le caselle riempivano le righe. Da quando sono otto - copie,
   platino e oro in piu' - l'ultima riga ne ha due e restavano quattro buchi grigi,
   che sembravano un blocco vuoto invece di niente. Ogni casella si porta il filo a
   destra e sotto, il contenitore quello sopra e a sinistra: cosi' il numero di
   caselle non conta piu'. */
.totali{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  background:var(--nero);border-top:1px solid var(--riga);border-left:1px solid var(--riga);
  border-radius:8px;overflow:hidden;margin-bottom:8px}
.totale{background:var(--nero);padding:18px 16px;
  border-right:1px solid var(--riga);border-bottom:1px solid var(--riga)}
/* ⚠ `nowrap` e una misura piu' prudente: "1994→2018" e' la cifra piu' lunga della
   riga e a 38px usciva dalla sua casella appena le colonne sono diventate sei. */
.totale .cifra{font-family:'Anton',Arial,sans-serif;font-size:clamp(24px,3vw,34px);
  line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.totale .cifra .punto{color:var(--rosso)}
.totale .eti{margin-top:7px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--debole);line-height:1.5}
/* Le certificazioni prendono lo stesso oro e lo stesso argento delle targhette che
   stanno sulla pagina del disco: sono la stessa cosa contata, non un dato nuovo.
   Il pallino davanti all'etichetta e' il disco. */
/* La fascia delle vendite: il numero piu' grosso che questa pagina ha da dire, e si
   vede. Sta sopra la griglia e non dentro, perche' fra sei caselle uguali qualunque
   cifra diventa una delle sei. */
.vendite{padding:6px 0 26px}
.vendite .cifra{font-family:'Anton',Arial,sans-serif;color:var(--rosso);
  font-size:clamp(58px,13vw,132px);line-height:.92;letter-spacing:.01em;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.vendite .cifra .mln{font-size:.3em;margin-left:.12em;letter-spacing:.06em;
  color:var(--grigio);vertical-align:.35em}
.vendite .eti{margin-top:10px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--grigio)}
.totale.oro .cifra{color:#E8C86A}
.totale.platino .cifra{color:#D9DEE6}
.totale.oro .eti::before,.totale.platino .eti::before{content:"";display:inline-block;
  width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.totale.oro .eti::before{background:linear-gradient(135deg,#F3DFA2,#B98F2E)}
.totale.platino .eti::before{background:linear-gradient(135deg,#FFFFFF,#98A2B0)}

section.blocco{padding:34px 0 0}
.titolo-blocco{padding-bottom:11px;border-bottom:1px solid var(--riga);margin-bottom:6px}
.titolo-blocco h2{font-family:'Anton',Arial,sans-serif;font-weight:400;font-size:20px;
  letter-spacing:.06em;text-transform:uppercase}
.titolo-blocco p{margin-top:7px;color:var(--grigio);font-size:13px;line-height:1.6;max-width:66ch}

/* classifica: una riga, una barra che dice quanto */
.classifica{padding-top:6px}
.voce{display:flex;gap:13px;align-items:center;padding:9px 0;border-bottom:1px solid var(--riga)}
.voce .pos{font-variant-numeric:tabular-nums;color:var(--debole);font-size:12px;
  flex:0 0 24px;text-align:right}
.voce .chi{flex:1;min-width:0}
.voce .nome{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.voce .nome a:hover{color:var(--rosso)}
/* Gli alias accanto al nome: si leggono se uno li cerca, non rubano la riga. */
.voce .nome .alias{color:var(--debole);font-size:12.5px}
.voce .barra{margin-top:7px;height:3px;background:#161616;border-radius:2px;overflow:hidden}
.voce .barra i{display:block;height:100%;background:var(--rosso)}
.voce .quanto{font-variant-numeric:tabular-nums;font-size:13px;flex:none;text-align:right}
.voce .quanto span{color:var(--debole);font-size:11px;display:block;margin-top:2px;
  letter-spacing:.08em;text-transform:uppercase}

/* anno per anno */
.tabella{width:100%;border-collapse:collapse;margin-top:6px}
.tabella th{text-align:left;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--debole);font-weight:400;padding:9px 10px 9px 0;border-bottom:1px solid var(--riga)}
.tabella td{padding:9px 10px 9px 0;border-bottom:1px solid var(--riga);font-size:14px;
  font-variant-numeric:tabular-nums}
.tabella td.testo{font-variant-numeric:normal}
.tabella .anno{color:var(--rosso)}
.scorre{overflow-x:auto}


/* ⚠️ **m2o si scrive SEMPRE minuscolo.** E' il nome della radio, non una sigla:
   il maiuscolo dei titoli lo stava trasformando in "M2O" dappertutto. Ogni testo
   che passa da un elemento in maiuscolo si porta dietro questo span, che spegne
   la trasformazione solo su quelle tre lettere. Regola di Amerigo, 23/08/2026. */
.m2o{text-transform:lowercase}
.coda{padding:34px 0 10px;color:var(--debole);font-size:12.5px;line-height:1.7;max-width:70ch}
.caricando{padding:60px 0;color:var(--grigio);font-size:14px}

footer{margin-top:auto;border-top:1px solid var(--riga);padding:20px 0 28px;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--debole);
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
footer a:hover{color:var(--bianco)}

@media (max-width:430px){
  .menu a[href="/"]{display:none}
  .menu{gap:13px;font-size:10px;letter-spacing:.12em}
  .testata{gap:10px}
}
</style>
</head>
<body>

<header>
  <div class="contenitore testata">
    <a class="logo" href="/">provenzano<span class="punto">.</span></a>
    <nav class="menu">
      <a href="/compilation/">I CD</a>
      <a href="/compilation/archivio/">Archivio</a>
      <a class="qui" href="/compilation/numeri/">I numeri</a>
      <a href="/">Home</a>
    </nav>
  </div>
</header>

<main class="contenitore">

  <div class="cartello">
    <h1>Compilation<span class="punto">.</span> I numeri</h1>
    <!-- ⚠ Il paragrafo sotto il titolo l'ha fatto togliere Amerigo il 27/08/2026
         (*"togli le info sotto il titolo i numeri"*), nello stesso giro in cui e' uscita
         la nota sulla fonte dei dati e il dettaglio delle copie. La pagina adesso apre
         sul numero delle vendite: e' quello il colpo, e ogni riga messa prima gli toglie
         il posto. Le spiegazioni su cosa entra nel conto restano nel README. -->
  </div>

  <div id="pagina"><p class="caricando">carico i numeri…</p></div>

  <!-- ⚠ La nota "Fonte dei dati: le schede Discogs" l'ha fatta togliere Amerigo il
       27/08/2026. Da quando in pagina ci sono anche le copie vendute, che Discogs non
       ha e non avra' mai, quella riga era diventata falsa: diceva che tutto veniva da
       li'. Se un domani serve rimettere una nota, va scritta per quello che la pagina
       mostra davvero, non ricopiata da com'era. -->

</main>

<footer class="contenitore">
  <span>&copy; 2026 Provenzano Dj</span>
  <span id="aggiornato"></span>
</footer>

<script>
(function () {
  'use strict';

  var $pagina = document.getElementById('pagina');

  function fuga(s) {
    return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function num(n) { return (n || 0).toLocaleString('it-IT'); }

  function blocco(titolo, spiega, dentro) {
    return '<section class="blocco"><div class="titolo-blocco"><h2>' + titolo + '</h2>' +
      (spiega ? '<p>' + spiega + '</p>' : '') + '</div>' + dentro + '</section>';
  }

  // ⚠️ `r.nome` arriva gia' pronto per la pagina: chi chiama passa il testo con
  // fuga() fatta, cosi' una riga puo' avere dentro anche un pezzo in grigio senza
  // che qui si debba disfare e rifare l'escape.
  function classifica(righe, massimo, indirizzo) {
    return '<div class="classifica">' + righe.map(function (r, i) {
      var nome = indirizzo ? '<a href="' + indirizzo(r) + '">' + r.nome + '</a>' : r.nome;
      return '<div class="voce"><span class="pos">' + (i + 1) + '</span>' +
        '<span class="chi"><span class="nome">' + nome + '</span>' +
        '<span class="barra" style="display:block"><i style="width:' +
          Math.max(2, Math.round(r.quanto / massimo * 100)) + '%"></i></span></span>' +
        '<span class="quanto">' + num(r.quanto) + '<span>' + r.unita + '</span></span></div>';
    }).join('') + '</div>';
  }

  function disegna(s) {
    var t = s.totali;
    var html = '';

    html += copie(s.vendite);
    html += '<div class="totali">' +
      /* ⚠ "compilation" e basta, non "compilation mixate" (Amerigo, 27/08/2026):
         due righe sopra c'e' gia' scritto *compilation vendute*, e la parola in piu'
         faceva sembrare i due numeri due cose diverse invece che le stesse 90. */
      totale(num(t.compilation), 'compilation') +
      /* ⚠ "tracce in scaletta" (2.177) tolta il 27/08/2026: *"metti solo il numero dei
         brani diversi 1995"*. Erano due cifre quasi uguali una accanto all'altra - il
         totale delle righe di scaletta e i titoli diversi - e chi legge non ha modo di
         sapere quale delle due sta guardando. Resta quella che dice qualcosa: quanti
         brani diversi sono passati. */
      totale(num(t.brani_unici), 'brani diversi') +
      totale(num(t.artisti), 'artisti') +
      certificate(s.certificazioni) +
      '</div>';

    /* ⚠ Due cose tolte da Amerigo il 27/08/2026, appena viste in pagina.

       La casella **1994→2018**: *"il numero 1994 2018 non e' utile"*. Non era un
       numero, era un intervallo - non dice quanto, dice quando - e in una riga di
       quantita' faceva rumore senza aggiungere niente. Gli anni si vedono gia' nel
       blocco Anno per anno, dove sono una tabella e non una cifra grossa.

       Il **dettaglio delle copie serie per serie**: resta il solo totale, in grande.
       Il conto pero' continua a girare - `stime-vendite.json` e `stima_vendite()` in
       costruisci.py - perche' il totale viene da li'. Per rimettere il blocco, i dati
       sono in `s.vendite.serie`. */

    var maxA = s.top_artisti.length ? s.top_artisti[0].presenze : 1;
    html += blocco('Gli artisti più presenti', null,
      /* ⚠ Solo le presenze, non il conto dei brani sotto: *"metti il numero di volte
         e basta non il numero di brani"* (Amerigo, 27/08/2026). Un artista con 63
         presenze e 58 brani obbligava a chiedersi che differenza ci fosse fra i due
         numeri per capire una classifica che dice una cosa sola - chi torna piu'
         spesso. Il conto dei brani si vede aprendo l'archivio, che e' dove uno va se
         quella domanda se la fa davvero. */
      /* ⚠ Gli altri nomi dello stesso progetto stanno **in parentesi accanto**, non
         su righe loro: *"Promise Land (Ranucci & Pelusi, System 3) e il conteggio si
         somma sotto Promise Land"* (Amerigo, 27/08/2026). Il link resta sul nome
         grande, che e' quello che l'archivio conosce - e li' dentro i due nomi ci sono
         tutti e due, ognuno coi suoi dischi. */
      classifica(s.top_artisti.slice(0, 30).map(function (a) {
        return { nome: fuga(a.nome) + (a.alias
                   ? ' <span class="alias">(' + fuga(a.alias.join(', ')) + ')</span>' : ''),
                 grezzo: a.nome, quanto: a.presenze,
                 unita: a.presenze === 1 ? 'volta' : 'volte' };
      }), maxA, function (r) {
        return '/compilation/archivio/?q=' + encodeURIComponent('artista:' + r.grezzo);
      }));

    var maxS = Math.max.apply(null, s.serie.map(function (x) { return x.tracce; }));
    html += blocco('Le serie',
      'Quanto pesa ognuna delle famiglie in cui si dividono le uscite.',
      classifica(s.serie.map(function (x) {
        return { nome: fuga(x.nome).replace(/m2o/gi, '<span class="m2o">m2o</span>') +
                   (x.dal ? ' · ' + x.dal + (x.al !== x.dal ? '–' + x.al : '') : ''),
                 quanto: x.tracce,
                 unita: x.compilation + (x.compilation === 1 ? ' disco' : ' dischi') };
      }), maxS, null));

    if (s.piu_volte && s.piu_volte.length) {
      var maxV = s.piu_volte[0].n;
      html += blocco('I brani rimessi più volte',
        'Un brano che torna in più compilation è un brano che ha tenuto: qui ci sono ' +
        'quelli che sono rientrati in scaletta più di una volta.',
        classifica(s.piu_volte.slice(0, 20).map(function (b) {
          return { nome: fuga(b.t) + (b.a.length
                     ? ' <span style="color:rgba(255,255,255,.35)">· ' +
                       fuga(b.a.join(', ')) + '</span>' : ''),
                   quanto: b.n, unita: 'compilation' };
        }), maxV, null));
    }

    html += blocco('Anno per anno', null,
      '<div class="scorre"><table class="tabella"><thead><tr>' +
      '<th>Anno</th><th>Compilation</th><th>Tracce</th></tr></thead><tbody>' +
      s.anni.map(function (a) {
        return '<tr><td class="anno">' + a.anno + '</td><td>' + a.compilation +
          '</td><td>' + num(a.tracce) + '</td></tr>';
      }).join('') + '</tbody></table></div>');

    /* ⚠ Il blocco **Le etichette** l'ha fatto togliere Amerigo il 27/08/2026: *"il
       dato sulle etichette non mi interessa"*. Chi ha pubblicato un disco resta scritto
       nella pagina di quel disco, che e' dove uno lo va a cercare; in classifica non
       diceva niente di lui - diceva quali case discografiche stampavano compilation
       negli anni '90, che e' una storia di qualcun altro.

       ⚠ Tolto anche il conto da `costruisci.py`, non solo il blocco: un dato che
       nessuno legge, dentro un JSON che si scarica a ogni visita, e' peso che nessuno
       si ricorda piu' perche' c'e'. Per rimetterlo servono le due righe - `etichette`
       nelle statistiche e questo blocco - e stanno entrambe nel commit che le ha
       tolte. */

    $pagina.innerHTML = html;
    document.getElementById('aggiornato').textContent =
      'Aggiornato al ' + s.aggiornato.split('-').reverse().join('/');
  }

  /* La casella apre la riga perche' e' il numero piu' grosso che questa pagina ha da
     dire. L'etichetta porta "stima" con se': una cifra a sette cifre senza quella
     parola si legge come un dato certificato, e non lo e'. */
  /* ⚠ **Fuori dalla riga, non dentro.** Come una casella fra sette era un numero come
     gli altri; *"rendi piu impattante il numero sulle vendite"* (Amerigo, 27/08/2026),
     e l'unico modo vero di rendere impattante una cifra e' non metterle accanto sei
     cifre uguali. Adesso e' una fascia sua sopra la griglia.

     ⚠ **E senza la parola "stima"**: tolta da Amerigo nello stesso momento. Che siano
     stime resta scritto dove i numeri stanno davvero - `stime-vendite.json`, con dentro
     chi li ha dati e quando - e la pagina non lo ripete. Decisione sua: e' il suo
     lavoro e sono i suoi dischi. */
  function copie(v) {
    if (!v || !v.totale) { return ''; }
    /* In milioni, non in cifre: *"fai la somma totale e scriviamo tot mln di dischi
       venduti"* (Amerigo, 27/08/2026), corretto subito dopo in **compilation** e non
       dischi: quello che si contava e' quante copie di queste 90 uscite sono state
       vendute, e chiamarle dischi le confondeva con i CD dentro le confezioni - il
       vol.30 da solo e' tre CD. Gli ingredienti sono stime a scaglioni tondi -
       20.000, 40.000 - e scrivere 2.860.000 darebbe a una somma di stime l'aria di un
       dato contato uno per uno. I due decimali restano perche' sono la somma vera:
       arrotondare a 2,9 sarebbe gonfiarla di quarantamila copie per fare piu' bella
       figura. Il numero esatto sta nel blocco qui sotto, serie per serie. */
    /* ⚠ **"2 mln 860 mila"**, scelto da Amerigo il 27/08/2026 fra dieci modi di
       scrivere lo stesso numero. Non e' quello che avrei messo io - gliel'ho detto -
       ma e' il suo lavoro e sono i suoi dischi, e la scelta e' registrata qui perche'
       fra sei mesi non torni fuori come una svista da correggere.

       Si ricava dal totale, non e' scritto: milioni e migliaia si spezzano dal numero,
       e il pezzo delle migliaia sparisce se e' zero (a 3.000.000 tondi la riga direbbe
       "3 mln", non "3 mln 0 mila"). Sotto il milione resta il solo blocco delle
       migliaia. */
    /* ⚠ **La cifra sopra, la stessa cifra a parole sotto**: *"2.860.000 e sotto metti
       2 milioni 860 mila compilation vendute"* (Amerigo, 27/08/2026), dopo aver visto
       le due versioni una accanto all'altra. Le parole non aggiungono un dato, danno
       il modo di **dirlo**: 2.860.000 lo si legge, "due milioni e ottocentosessantamila"
       lo si ripete. Su un numero che serve a essere raccontato non e' un doppione.

       Le parole si ricavano dal totale, non sono scritte: se un giorno la somma cambia,
       cambiano tutte e due le righe insieme. Il pezzo delle migliaia sparisce se e'
       zero, e il singolare c'e' per l'anno in cui dovesse servire. */
    var milioni = Math.floor(v.totale / 1000000);
    var migliaia = Math.round((v.totale - milioni * 1000000) / 1000);
    var parole = [];
    if (milioni) {
      parole.push(num(milioni) + (milioni === 1 ? ' milione' : ' milioni'));
    }
    if (migliaia) { parole.push(num(migliaia) + ' mila'); }
    parole.push('compilation vendute');
    return '<div class="vendite"><div class="cifra">' + num(v.totale) + '</div>' +
      '<div class="eti">' + parole.join(' ') + '</div></div>';
  }

  /* Le certificazioni non stanno scritte: si contano dai premi dei dischi, e la
     casella compare solo se ce n'e' almeno una. Al sesto disco d'oro qui cambia da
     solo, che e' il motivo per cui non c'e' un 5 scritto a mano da nessuna parte. */
  function certificate(c) {
    if (!c) { return ''; }
    var fuori = '';
    if (c.platino && c.platino.length) {
      fuori += totale(num(c.platino.length),
        c.platino.length === 1 ? 'disco di platino' : 'dischi di platino', 'platino');
    }
    if (c.oro && c.oro.length) {
      fuori += totale(num(c.oro.length),
        c.oro.length === 1 ? "disco d'oro" : "dischi d'oro", 'oro');
    }
    return fuori;
  }

  function totale(cifra, eti, classe) {
    return '<div class="totale' + (classe ? ' ' + classe : '') + '"><div class="cifra">' +
      cifra + '</div><div class="eti">' + eti + '</div></div>';
  }

  /* ⚠ `no-cache` non e' pignoleria: GitHub Pages serve tutto con `max-age=600`, e per
     dieci minuti il browser puo' tenersi il JSON vecchio. Il guaio non e' l'attesa, e'
     l'accoppiata: pagina nuova appena arrivata e dati vecchi ancora in cache, cioe'
     numeri sbagliati dentro un impaginato giusto - e nessuno se ne accorge. Con
     `no-cache` la richiesta parte comunque e l'ETag decide: se non e' cambiato niente
     la risposta e' un 304 e non costa banda. Le pagine del Crossover lo facevano gia'
     dal primo giorno; qui era rimasto indietro, ed e' saltato fuori il 27/08/2026 con
     Amerigo che guardava una pagina vecchia mentre quella online era gia' aggiornata. */
  fetch('/compilation/dati/statistiche.json', {cache: 'no-cache'})
    .then(function (r) { return r.json(); })
    .then(disegna)
    .catch(function () {
      $pagina.innerHTML = '<p class="caricando">Non riesco a caricare i numeri. ' +
        'Riprova fra un momento.</p>';
    });
})();
</script>
