<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provenzano Dj</title>
<meta name="description" content="Dj e produttore. Trent&rsquo;anni a scegliere musica, produrla e proporla — in radio, in pista, sui social. Crossover, il New Music Friday: tutte le puntate. Booking: booking@provenzanodj.com">
<meta property="og:title" content="Provenzano Dj">
<meta property="og:description" content="Da oltre trent'anni a scegliere musica, produrla e proporla — in radio, in pista, sui social.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.provenzanodj.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ccircle cx='32' cy='38' r='14' fill='%23FF3131'/%3E%3C/svg%3E">
<style>
@font-face{
  font-family:'Anton';
  src:url('fonts/Anton-Regular.ttf') format('truetype');
  font-display:swap;
}
@font-face{
  font-family:'Poppins EB';
  src:url('fonts/Poppins-ExtraBold.ttf') format('truetype');
  font-display:swap;
}
:root{
  --nero:#000;
  --rosso:#FF3131;
  --bianco:#fff;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--nero);
  color:var(--bianco);
  font-family:'Anton',Arial,sans-serif;
  display:flex;
  flex-direction:column;
  min-height:100svh;
}
a{color:inherit;text-decoration:none}

.pagina{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:48px 24px 32px;
  gap:0;
}

/* logo — l'unica cosa minuscola della pagina */
.logo{
  font-family:'Poppins EB',Arial,sans-serif;
  font-weight:800;
  font-size:clamp(20px,3.4vw,28px);
  letter-spacing:-0.04em;
  line-height:1;
}
.logo .punto{color:var(--rosso)}

/* cartello — sotto il logo c'e' Crossover, la cosa che il sito ha davvero */
.cartello{
  margin-top:clamp(40px,9vh,88px);
  text-transform:uppercase;
}
.cartello .nome{
  display:inline-block;
  /* tre voci della stessa misura: 88px le faceva scendere sotto la piega,
     e la terza si vedeva solo scrollando */
  font-size:clamp(32px,7.4vw,66px);
  font-weight:400;
  line-height:1;
  letter-spacing:.045em;
  border-bottom:2px solid transparent;
  padding-bottom:6px;
  transition:border-color .18s;
}
.cartello .nome .punto{
  color:var(--rosso);
  animation:batte 2.4s ease-in-out infinite;
}
.cartello a:hover .nome{border-bottom-color:var(--rosso)}
.cartello .invito{
  margin-top:14px;
  font-family:Arial,sans-serif;
  font-size:11px;
  letter-spacing:.2em;
  color:rgba(255,255,255,.45);
  transition:color .15s;
}
.cartello a:hover .invito{color:var(--rosso)}
@keyframes batte{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.cartello .nome .punto{animation:none}}

/* I tre cartelli sono tre porte sullo stesso archivio e stanno in colonna,
   della stessa misura: Crossover, Discografia, Compilation. Prima Compilation
   era un gradino sotto Crossover, ma con tre voci la scala diventava una
   classifica - e non e' quello che sono (scelta di Amerigo, 29/08/2026). */
.cartello.secondo{margin-top:clamp(22px,4vh,40px)}
/* il punto che batte e' uno solo: tre sarebbero tre cose che chiamano insieme */
.cartello.secondo .nome .punto{animation:none}

.cartello .tesi{
  margin:26px auto 0;
  font-size:clamp(11px,1.7vw,14px);
  letter-spacing:.12em;
  line-height:1.7;
  color:rgba(255,255,255,.55);
  max-width:44ch;
  text-transform:none;
}
.cartello .tesi em{font-style:normal;color:var(--bianco)}

/* scrivimi — una domanda sola, tre indirizzi */
.booking{
  margin-top:clamp(44px,9vh,88px);
  text-transform:uppercase;
}
.booking .domanda{
  font-size:clamp(14px,2.2vw,19px);
  letter-spacing:.08em;
}
.booking .domanda .punto{color:var(--rosso)}
.booking .mails{
  margin-top:20px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:18px 34px;
}
.booking .voce{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
}
.booking .eti{
  font-family:Arial,sans-serif;
  font-size:10px;
  letter-spacing:.2em;
  color:rgba(255,255,255,.4);
}
.booking .mail{
  display:inline-block;
  font-size:clamp(12px,1.8vw,14px);
  letter-spacing:.14em;
  color:var(--rosso);
  border-bottom:1px solid var(--rosso);
  padding-bottom:3px;
}
.booking .mail:hover{color:var(--bianco);border-color:var(--bianco)}
.copiato{
  margin-top:16px;
  font-family:Arial,sans-serif;
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:rgba(255,255,255,.55);
  opacity:0;
  transition:opacity .25s;
}
.copiato.si{opacity:1}

/* social */
.social{
  margin-top:clamp(44px,8vh,80px);
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:26px 30px;
  max-width:520px;
}
.social a{display:block;line-height:0;opacity:.6;transition:opacity .15s}
.social a:hover{opacity:1}
.social img{width:18px;height:18px}

footer{
  padding:20px 24px 26px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  font-family:Arial,sans-serif;
  font-size:9px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:rgba(255,255,255,.3);
}
.stats-link{display:block;line-height:0;opacity:.3;transition:opacity .15s}
.stats-link:hover{opacity:1}
.stats-link svg{width:13px;height:13px}
</style>
</head>
<body>

<main class="pagina">
  <div class="logo">provenzano<span class="punto">.</span></div>

  <section class="cartello">
    <a href="/crossover/puntate/" aria-label="Crossover — tutte le puntate">
      <h1 class="nome">Crossover<span class="punto">.</span></h1>
    </a>
  </section>

  <section class="cartello secondo">
    <a href="/discografia/" aria-label="Discografia — tutte le uscite">
      <h2 class="nome">Discografia<span class="punto">.</span></h2>
    </a>
  </section>

  <section class="cartello secondo">
    <a href="/compilation/" aria-label="Compilation — tutte quelle mixate">
      <h2 class="nome">Compilation<span class="punto">.</span></h2>
    </a>
    <p class="tesi">Da oltre trent'anni a scegliere musica, produrla e proporla &mdash; <em>in radio, in pista, sui social</em>.</p>
  </section>

  <section class="booking">
    <p class="domanda">Scrivimi<span class="punto">.</span></p>
    <div class="mails">
      <div class="voce">
        <span class="eti">una data</span>
        <a class="mail" href="mailto:booking@provenzanodj.com">booking@provenzanodj.com</a>
      </div>
      <div class="voce">
        <span class="eti">un remix</span>
        <a class="mail" href="mailto:remix@provenzanodj.com">remix@provenzanodj.com</a>
      </div>
      <div class="voce">
        <span class="eti">altro</span>
        <a class="mail" href="mailto:info@provenzanodj.com">info@provenzanodj.com</a>
      </div>
    </div>
    <div class="copiato" id="copiato">copiato negli appunti &#10003;</div>
  </section>

  <nav class="social" aria-label="Canali social">
    <a href="https://www.instagram.com/provenzanodj/" aria-label="Instagram"><img src="icons/instagram.svg" alt="Instagram"></a>
    <a href="https://www.mixcloud.com/provenzanodj/" aria-label="Mixcloud"><img src="icons/mixcloud.svg" alt="Mixcloud"></a>
    <a href="https://open.spotify.com/intl-it/artist/0X31zioYkeZFA3GBQR937K" aria-label="Spotify"><img src="icons/spotify.svg" alt="Spotify"></a>
    <a href="https://music.apple.com/it/artist/provenzano/278152767" aria-label="Apple Music"><img src="icons/applemusic.svg" alt="Apple Music"></a>
    <a href="https://www.beatport.com/it/artist/provenzano/43592" aria-label="Beatport"><img src="icons/beatport.svg" alt="Beatport"></a>
    <a href="https://soundcloud.com/provenzano_official" aria-label="SoundCloud"><img src="icons/soundcloud.svg" alt="SoundCloud"></a>
    <a href="https://www.youtube.com/@provenzanodj_official" aria-label="YouTube"><img src="icons/youtube.svg" alt="YouTube"></a>
    <a href="https://www.tiktok.com/@provenzanodj_official" aria-label="TikTok"><img src="icons/tiktok.svg" alt="TikTok"></a>
    <a href="https://www.facebook.com/provenzanodj" aria-label="Facebook"><img src="icons/facebook.svg" alt="Facebook"></a>
  </nav>
</main>

<script>
// Il mailto sul desktop spesso apre il popup "scegli un'app" invece della
// posta: il click copia l'indirizzo negli appunti e lo dice. Il mailto resta
// nell'href per chi ci arriva senza JavaScript o col client configurato
// (tenendo premuto / tasto destro).
document.querySelectorAll('.mail').forEach(function (link) {
  link.addEventListener('click', function (ev) {
    ev.preventDefault();
    var mail = link.textContent.trim();
    var conferma = function () {
      var c = document.getElementById('copiato');
      c.textContent = mail + ' — copiato negli appunti ✓';
      c.classList.add('si');
      setTimeout(function () { c.classList.remove('si'); }, 2200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(mail).then(conferma);
    } else {
      var t = document.createElement('textarea');
      t.value = mail; document.body.appendChild(t);
      t.select(); document.execCommand('copy'); t.remove();
      conferma();
    }
  });
});
</script>

<footer>
  <span>&copy; 2026 Provenzano Dj</span>
  <a class="stats-link" href="/stats/" aria-label="Stats">
    <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="#fff">
      <rect x="1" y="9" width="3.2" height="6" rx="1"/>
      <rect x="6.4" y="5" width="3.2" height="10" rx="1"/>
      <rect x="11.8" y="1" width="3.2" height="14" rx="1" fill="#FF3131"/>
    </svg>
  </a>
</footer>

</body>
</html>
